---
name: CI/CD
on:
  push:
    paths:
      - '.github/workflows/.cicd.yml'
      - '.github/workflows/10-lint.yml'
      - '.github/workflows/20-test.yml'
      - '.github/workflows/30-build-binaries.yml'
      - '.github/workflows/35-build-and-push-docker-images-to-ecr.yml'
      - '.github/workflows/40-deploy-to-aws.yml'
      - '.github/workflows/40-deploy-to-homelab.yml'
      - '.github/workflows/50-upload-artifacts-to-s3.yml'
      - '.github/workflows/99-post-to-slack.yml'
      - 'bin/*'
      - '**Dockerfile'
      - 'Makefile*'
  workflow_dispatch:
  repository_dispatch:
    types: [update-cicd]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  lint:
    uses: ./.github/workflows/10-lint.yml
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  lint-ansible:
    uses: ./.github/workflows/10-lint.yml
    with:
      ansible: true
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  test:
    uses: ./.github/workflows/20-test.yml
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  post-to-slack:
    needs: [lint, lint-ansible, test]
    if: always()
    uses: ./.github/workflows/99-post-to-slack.yml
    secrets:
      WEBHOOK: ${{ secrets.SLACK_GITHUB_NOTIFICATIONS_WEBHOOK }}

