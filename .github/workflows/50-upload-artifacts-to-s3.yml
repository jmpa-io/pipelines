---
on:
  workflow_call:
    inputs:
      artifact:
        description: |
          A space separated list of the paths to artifacts that you want uploaded to AWS S3.

          The repository name will be used for the path to the bucket in AWS S3.
        type: string
        required: true
      environment:
        description: The environment whose bucket (SSM /<env>.<repo>/bucket) the artifacts are uploaded to.
        type: string
        default: dev
      account_id:
        description: >
          The AWS account to deploy into. Defaults to the AWS_ACCOUNT_ID secret / variable, then to the
          prod account. Set it (e.g. to the dev account) to point a dev environment at a different account.
        type: string
        default: ""
    secrets:
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_RUNNER_ROLE_NAME:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Configure AWS.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id || secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID || '104132128521' }}:role/${{ secrets.AWS_RUNNER_ROLE_NAME || vars.AWS_RUNNER_ROLE_NAME || 'github-actions' }}
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Upload artifacts to S3.
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: make sync
