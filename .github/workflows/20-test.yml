---
on:
  workflow_call:
    inputs:
      with-code-coverage:
        description: Determines if code-coverage is generated when running tests.
        type: boolean
        default: false
      targets:
        description: Make targets to run, e.g. 'test-go test-py'. Defaults to every language ('test').
        type: string
        default: test
      dotnet:
        description: When true, tests a .NET repo on the runner (setup-dotnet) instead of in docker-go.
        type: boolean
        default: false
      dotnet-version:
        description: The .NET SDK version to install, used when dotnet is true.
        type: string
        default: 10.0.x
      run-make-tests:
        description: When false, skips the docker 'make' test job (e.g. for repos that only use the node tests below).
        type: boolean
        default: true
      node-tests:
        description: When true, also runs node tests (opt-in; independent of the make test job).
        type: boolean
        default: false
      node-version:
        description: Node.js version used when node-tests is true.
        type: string
        default: lts/*
      node-working-directory:
        description: Directory the node tests run from (and where package-lock.json is looked for), when node-tests is true.
        type: string
        default: .
      node-test-command:
        description: Command that runs the node tests, e.g. 'npm test' or 'npx playwright test'.
        type: string
        default: node --test
      node-playwright:
        description: When true (with node-tests), installs the Playwright browsers before running the tests and uploads the report on failure.
        type: boolean
        default: false
    secrets:
      AWS_REGION:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      AWS_RUNNER_ROLE_NAME:
        required: false
      ADMIN_GITHUB_TOKEN:
        required: false
      CODECOV_TOKEN:

jobs:
  run:
    if: ${{ inputs.run-make-tests && !inputs.dotnet }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v7

      # - name: Setup private Go dependencies.
      #   run: git config --global url."https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Configure AWS.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID || '104132128521' }}:role/${{ secrets.AWS_RUNNER_ROLE_NAME || vars.AWS_RUNNER_ROLE_NAME || 'github-actions' }}
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      # Private jmpa-io Go modules need a token; read it from SSM (not from
      # org secrets, which don't reach private repos on a free plan).
      - name: Setup private Go dependencies.
        run: |
          set -euo pipefail
          token=$(aws ssm get-parameter --name /tokens/github \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$token"
          {
            echo "GOPRIVATE=github.com/jmpa-io/*"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${token}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"

      - name: Test.
        run: |
          img="ghcr.io/jmpa-io/docker-go:latest"
          echo "##[group]Pulling image."
          docker pull "$img"
          echo "##[endgroup]"
          docker run \
            -v "$PWD:/go/src/app" \
            -w "/go/src/app" \
            -e CI \
            -e GOPRIVATE \
            -e GIT_CONFIG_COUNT \
            -e GIT_CONFIG_KEY_0 \
            -e GIT_CONFIG_VALUE_0 \
            "$img" \
            sh -c "make ${{ inputs.targets }} ${{ inputs.with-code-coverage && 'code-coverage' || '' }}"

      - name: Upload code-coverage to codecov.
        if: inputs.with-code-coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  run-dotnet:
    if: ${{ inputs.dotnet }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Setup .NET.
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Test.
        run: make test-csharp

  run-node:
    if: ${{ inputs.node-tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.node-working-directory }}
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Setup node.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json, skipping install."
          fi

      - name: Install Playwright browsers.
        if: inputs.node-playwright
        run: npx playwright install --with-deps

      - name: Test.
        run: ${{ inputs.node-test-command }}

      - name: Upload Playwright report.
        if: failure() && inputs.node-playwright
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ inputs.node-working-directory }}/playwright-report
          if-no-files-found: ignore
