---
on:
  workflow_call:
    secrets:
      REGISTRY:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

jobs:
  run:
    runs-on: homelab-runners
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Login to homelab Docker registry.
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build images & push to homelab Docker registry.
        run: make push ECR=${{ secrets.REGISTRY }}
