---
name: Generate README
on:
  workflow_call:
    inputs:
      org:
        description: The GitHub organisation owning the repository.
        type: string
        default: jmpa-io
    secrets:
      AWS_REGION:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      AWS_RUNNER_ROLE_NAME:
        required: false
      ADMIN_GITHUB_TOKEN:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Configure AWS.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID || '104132128521' }}:role/${{ secrets.AWS_RUNNER_ROLE_NAME || vars.AWS_RUNNER_ROLE_NAME || 'github-actions' }}
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      # Read the token from SSM rather than from repo/org secrets, which don't
      # reach every repo.
      - name: Read GitHub token from SSM.
        run: |
          set -euo pipefail
          token=$(aws ssm get-parameter --name /tokens/github \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$token"
          echo "ADMIN_GITHUB_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Checkout templates.
        uses: actions/checkout@v4
        with:
          repository: jmpa-io/templates
          path: .templates
          token: ${{ env.ADMIN_GITHUB_TOKEN }}

      - name: Generate README.
        env:
          GITHUB_TOKEN: ${{ env.ADMIN_GITHUB_TOKEN }}
        run: bash .templates/bin/README.sh ${{ inputs.org }}

      - name: Commit & push README.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update README.md [skip ci]"
          git push
