on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use for ansible-lint and yamllint.
        type: string
        default: '3.13'
      requirements:
        description: Path to pip requirements file.
        type: string
        default: inventory/requirements.txt
      collections:
        description: Path to Ansible Galaxy requirements file.
        type: string
        default: requirements.yml

jobs:
  run:
    name: Lint (Ansible + YAML + Shell + Docker + Workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout.
        uses: actions/checkout@v7

      - name: Set up Python.
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements }}

      - name: Install Python dependencies.
        run: |
          pip install --upgrade pip
          pip install -r ${{ inputs.requirements }} ansible-lint yamllint

      - name: Install Ansible collections.
        run: ansible-galaxy collection install -r ${{ inputs.collections }}

      - name: Install shellcheck.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install hadolint.
        run: |
          HADOLINT_VERSION="2.12.0"
          curl -sSL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Install actionlint.
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint

      - name: Lint.
        run: make lint
