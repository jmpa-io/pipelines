---
on:
  workflow_call:
    inputs:
      environment:
        description: The environment to use when deploying.
        type: string
        default: dev
    secrets:
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_RUNNER_ROLE_NAME:
        required: true
      ADMIN_GITHUB_TOKEN:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Configure AWS.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_RUNNER_ROLE_NAME || vars.AWS_RUNNER_ROLE_NAME || 'github-actions' }}
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Login to AWS ECR.
        uses: aws-actions/amazon-ecr-login@v2

      # Private jmpa-io Go modules need a token; read it from SSM (not from
      # org secrets, which don't reach private repos on a free plan).
      - name: Setup private Go dependencies.
        run: |
          set -euo pipefail
          token=$(aws ssm get-parameter --name /tokens/github \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$token"
          {
            echo "GOPRIVATE=github.com/jmpa-io/*"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${token}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"

      - name: Build binaries.
        run: |
          img="${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}.amazonaws.com/docker/go"
          echo "##[group]Pulling image."
          docker pull "$img"
          echo "##[endgroup]"
          docker run \
            -v "$PWD:/go/src/app" \
            -w "/go/src/app" \
            -e CI \
            -e GOPRIVATE \
            -e GIT_CONFIG_COUNT \
            -e GIT_CONFIG_KEY_0 \
            -e GIT_CONFIG_VALUE_0 \
            -e ENVIRONMENT=${{ inputs.environment }} \
            "$img" \
            sh -c "make binaries"

      - name: Upload artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: dist/
